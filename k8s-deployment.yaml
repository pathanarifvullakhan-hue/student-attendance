apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: attendance
  template:
    metadata:
      labels:
        app: attendance
    spec:
      containers:
      - name: attendance-app
        image: attendance-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: attendance-service
spec:
  type: NodePort
  selector:
    app: attendance
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
